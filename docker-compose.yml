services:
  db:
    image: postgres:16-alpine
    container_name: repair-system-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repair_pass}
      POSTGRES_DB: ${POSTGRES_DB:-repair_system}
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    ports:
      # 5433 on the host, since a local PostgreSQL may already occupy 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
